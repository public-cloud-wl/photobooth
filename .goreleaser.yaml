# .goreleaser.yaml
version: 2
builds:
  - id: photobooth
    env:
      - CGO_ENABLED=0
    main: ./photobooth.go
    binary: photobooth
    goos:
      - linux
    goarch:
      - amd64 # Add other architectures if needed
    flags:
      - -trimpath
    ldflags:
      - -s -w
    hooks:
      pre: sed -i "s/VERSION/{{.Version}}/g" static/index.html

snapshot:
  version_template: '{{ .Version }}-SNAPSHOT-{{ .ShortCommit }}'

# nFPM configuration to package the software
nfpms:
  - id: photobooth_rpm
    package_name: photobooth
    vendor: Worldline
    homepage: https://github.com/public-cloud-wl/photobooth
    maintainer: Romain Philibert <filirom1@gmail.com>
    description: |-
      The photobooth software.
      Takes awesome pictures and lets you share them.
    license: MIT
    formats:
      - rpm
    contents:
      - src: ./photobooth.service
        dst: /etc/systemd/system/photobooth.service
      - src: ./static/
        dst: /var/www/photobooth/static/
      - src: ./static/images/
        dst: /var/www/photobooth/static/images/
    scripts:
      postinstall: ./after-install
    ids:
      - photobooth
    file_name_template: >-
      {{- if .IsSnapshot -}}
        {{ .PackageName }}-{{ .Version }}-snapshot.x86_64
      {{- else -}}
        {{ .PackageName }}-{{ .Version }}-1.x86_64
      {{- end -}}

# Other GoReleaser configurations (e.g., snapshot, changelog)
