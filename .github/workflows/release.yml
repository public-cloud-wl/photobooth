name: GoReleaser

on:
  push:
    tags:
      - 'v*'
  pull_request:
    types: [opened, synchronize, reopened]

# Releases need permissions to read and write the repository contents.
# GitHub considers creating releases and uploading assets as writing contents.
permissions:
  contents: write
  pull-requests: write  # Needed to comment on PRs

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          fetch-depth: 0  # Important for GoReleaser to work properly

      - name: Set up Go
        uses: actions/setup-go@v2
        with:
          go-version: '1.20'

      - name: Run GoReleaser (Release)
        if: startsWith(github.ref, 'refs/tags/')
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser (Snapshot)
        if: github.event_name == 'pull_request'
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload snapshot artifacts
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-pr-${{ github.event.number }}
          path: dist/

      - name: Comment on PR with download link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const runUrl = `${context.payload.repository.html_url}/actions/runs/${context.runId}`;
            
            const body = `**Snapshot build completed!**
            
            Download the snapshot artifacts from the [workflow run](${runUrl}).
            
            **Artifact name:** \`snapshots-pr-${{ github.event.number }}\`
            
            The snapshot includes:
            - Binary: \`photobooth\`
            - RPM package: \`photobooth-*-snapshot.x86_64.rpm\`
            
            > This snapshot was built from commit ${{ github.event.pull_request.head.sha }}`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });